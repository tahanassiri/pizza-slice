# Production compose: Caddy on :80 only; api/web not published.
# Secrets come from /opt/nova-export/.env (never commit).
services:
  api:
    build:
      context: ./apps/api
      labels:
        org.opencontainers.image.revision: ${NOVA_REVISION:-unknown}
    env_file:
      - .env
    environment:
      ENVIRONMENT: production
      DATABASE_URL: sqlite:////app/data/nova.db
      PROVIDER_MODE: auto
      ORCHESTRATOR_STEP_DELAY_MS: "80"
    volumes:
      - api-data:/app/data
    expose:
      - "8000"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    build:
      context: ./apps/web
      labels:
        org.opencontainers.image.revision: ${NOVA_REVISION:-unknown}
      args:
        NEXT_PUBLIC_DATA_SOURCE: live
        # Same-origin via Caddy — browser calls /api/* on this host
        NEXT_PUBLIC_API_BASE_URL: ""
    environment:
      NEXT_PUBLIC_DATA_SOURCE: live
      NEXT_PUBLIC_API_BASE_URL: ""
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - api
      - web
    restart: unless-stopped

volumes:
  api-data:
  caddy-data:
  caddy-config:
