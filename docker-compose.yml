services:
  api:
    build:
      context: ./apps/api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/nova.db
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000,http://localhost
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: nova-dev-change-me
      SESSION_SECRET: compose-dev-session-secret-change-me
      SECRETS_FERNET_KEY: ""
      ORCHESTRATOR_STEP_DELAY_MS: "80"
      PROVIDER_MODE: auto
    volumes:
      - api-data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_DATA_SOURCE: live
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_DATA_SOURCE: live
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

  # Optional reverse-proxy stub (not required for local `api` + `web` ports)
  caddy:
    image: caddy:2-alpine
    profiles: ["proxy"]
    ports:
      - "8080:80"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - api
      - web

volumes:
  api-data:
